# Resolve the cfacv tree from the environment when it is set (runstring.sh
# exports it, as should a batch script that launches NAMD directly), so the example still works when it has
# been staged somewhere other than inside the repository -- e.g. copied to
# /scratch on a cluster, where "../.." is not a cfacv checkout.
if {[info exists env(CFACV_BASEDIR)]} {
  set CFACV_BASEDIR $env(CFACV_BASEDIR)
} else {
  set CFACV_BASEDIR ../..
}

source alad_stringmethod.conf

# prevent VMD from reading replica.namd by trying command only NAMD has
if { ! [catch numPes] } { source $CFACV_BASEDIR/tcl/stringmethod.tcl }

