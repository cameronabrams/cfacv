# Continuation of the string-method run started by job0.conf.
#
# Rewritten 2026-11-10.  The previous contents sourced "fold_alanin.conf" and
# "../replica.namd", neither of which exists in this example or anywhere in
# this repository; they were carried over from an unrelated NAMD replica
# tutorial, so this file could never have run as shipped.
#
# stringmethod.tcl picks up a run by sourcing $restart_file, which sets
# i_job, i_run, i_step and restart_root.  The master restart file is written
# as $output_root.job<N>.restart<i_run>.tcl with the replica placeholder left
# empty, hence the [format ... ""] below.  Change 10000 to whichever
# iteration you are resuming from; see "ls output//alad_sm.job0.restart*.tcl".

# Resolve the cfacv tree from the environment when it is set (runstring.sh
# and the sbatch script export it), so the example still works when it has
# been staged somewhere other than inside the repository -- e.g. copied to
# /scratch on a cluster, where "../.." is not a cfacv checkout.
if {[info exists env(CFACV_BASEDIR)]} {
  set CFACV_BASEDIR $env(CFACV_BASEDIR)
} else {
  set CFACV_BASEDIR ../..
}

source alad_stringmethod.conf

set restart_file [format "$output_root.job0.restart10000.tcl" ""]
set num_runs 20000

# prevent VMD from reading this by trying a command only NAMD has
if { ! [catch numPes] } { source $CFACV_BASEDIR/tcl/stringmethod.tcl }
