# Continuation of the string-method run started by job0.conf.
#
# Rewritten 2026-11-10.  The previous contents sourced "fold_alanin.conf" and
# "../replica.namd", neither of which exists in this example or anywhere in
# this repository; they were carried over from an unrelated NAMD replica
# tutorial, so this file could never have run as shipped.
#
# stringmethod.tcl resumes by sourcing $restart_file, which sets i_job,
# i_run, i_step and restart_root.  The driver deletes each previous restart
# root as it writes the next, so normally only the newest survives; this
# file finds it rather than naming an iteration that may already be gone.
# Override with CFACV_RESTART_FILE to resume from a specific one.
#
# Set num_runs to the new TOTAL iteration count, not the number of extra
# iterations: the driver loops while {$i_run < $num_runs}.

if {[info exists env(CFACV_BASEDIR)]} {
  set CFACV_BASEDIR $env(CFACV_BASEDIR)
} else {
  set CFACV_BASEDIR ../..
}

source alad_stringmethod.conf

if {[info exists env(CFACV_RESTART_FILE)]} {
  set restart_file $env(CFACV_RESTART_FILE)
} else {
  set pat [format "$output_root.job*.restart*.tcl" ""]
  set best ""
  set bestn -1
  foreach f [glob -nocomplain $pat] {
    if {[regexp {restart([0-9]+)\.tcl$} $f -> n]} {
      if {$n > $bestn} { set bestn $n ; set best $f }
    }
  }
  if {$best eq ""} {
    puts "CFACV/SM) ERROR: no restart file matches $pat"
    puts "CFACV/SM) Has job0 run, and did it reach a restart point?"
    exit 1
  }
  set restart_file $best
}
puts "CFACV/SM) resuming from $restart_file"

if {[info exists env(CFACV_NUM_RUNS)]} {
  set num_runs $env(CFACV_NUM_RUNS)
}

# prevent VMD from reading this by trying a command only NAMD has
if { ! [catch numPes] } { source $CFACV_BASEDIR/tcl/stringmethod.tcl }
