# Unbiased MD that reports cfacv's own collective-variable values every
# TAMDof steps while writing a trajectory at the same frequency, so the
# online values can be checked against the same quantities measured
# independently from the DCD afterwards.
#
# This is the "Implementation" validation gate: online cfacv CV values must
# agree with independent post hoc values before any result computed with
# them is interpreted.
#
# Force constants are zero, so the CVs are measured and not driven -- the
# trajectory is plain MD and the comparison is not circular.
#
# cv_check.inp exercises BOND and ANGLE as well as DIHED.  The string-method
# example only ever uses DIHED, but BOND carries most of the coordinates in
# the T4L work, so it needs to be exercised somewhere.

if {[info exists env(CFACV_BASEDIR)]} {
  set CFACV_BASEDIR $env(CFACV_BASEDIR)
} else {
  set CFACV_BASEDIR ../..
}

structure       alad_wb.psf
coordinates     alad_wb.pdb
bincoordinates  go_md.coor
binvelocities   go_md.vel
extendedSystem  go_md.xsc

paraTypeCharmm      on
parameters          par_all22_prot.prm
parameters          toppar_water_ions_namd.str

exclude             scaled1-4
1-4scaling          1.0
cutoff              9.0
switching           on
switchdist          8.5
pairlistdist        10.0

timestep            1.0
rigidbonds          all
nonbondedFreq       1
fullElectFrequency  2
stepspercycle       10

PME                 on
pmegridspacing      1.0
wrapall             on

langevin            on
langevinDamping     5
langevinTemp        300
langevinHydrogen    no
seed                20261110

outputname          cvcheck
outputEnergies      100
dcdfreq             10
restartfreq         2000

tclforces           on
tclforcesscript     ${CFACV_BASEDIR}/tcl/cfacv_tclforces.tcl
set labelPDB        label.pdb
set cvINP           cv_check.inp
set restrPARAMS     {{k 0.0}}  ; # zero bias: measure, do not drive
set TAMDof          10         ; # report CVs every 10 steps, matching dcdfreq
set TAMDoutputlevel 3          ; # bit 1 = Z, bit 2 = Th (the CV values)
set TAMDoutputFile  cvcheck.cvout

run 2000
